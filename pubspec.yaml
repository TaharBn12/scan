name: billing_app
description: Offline-first POS & billing app with barcode scanning, thermal printing, stock, customers and reports.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  get_it: ^7.6.7
  equatable: ^2.0.5

  # Functional Programming
  fpdart: ^1.1.0

  # Code Generation Annotations
  json_annotation: ^4.9.0

  # Navigation
  go_router: ^14.0.0

  # Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Utilities
  vibration: ^3.1.8
  # flutter_localizations pins a specific intl version; "any" lets pub pick it.
  intl: any
  permission_handler: ^11.3.1
  uuid: ^4.5.2
  app_settings: ^7.0.0
  http: ^1.2.0
  crypto: ^3.0.3
  url_launcher: ^6.3.0

  # Files, sharing & documents
  path_provider: ^2.1.3
  share_plus: '>=11.0.0 <14.0.0'
  file_picker: '>=8.0.0 <11.0.0'
  pdf: ^3.11.0

  # Scanner & Printer
  pretty_qr_code: ^3.3.0
  print_bluetooth_thermal: ^1.1.2
  mobile_scanner: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code Generation (kept for compatibility with existing build scripts;
  # Hive adapters are now hand-written, see lib/core/data/adapters/).
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  # Bundled so the app renders Arabic (and Latin) text fully offline and the
  # same face can be embedded in generated PDFs.
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
