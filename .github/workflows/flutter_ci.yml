name: Flutter CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get packages
        run: flutter pub get 2>&1 | tee pubget.txt

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs 2>&1 | tail -n 60

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat analyze.txt
          # Turn analyzer findings into annotations (GitHub caps these per step,
          # the full text is also posted as a commit comment below).
          grep -E '^\s*(error|warning|info) •' analyze.txt | head -n 30 | while IFS= read -r line; do
            level=$(echo "$line" | sed -E 's/^\s*(error|warning|info) •.*/\1/')
            msg=$(echo "$line" | sed -E 's/^\s*(error|warning|info) • (.*) • ([^ ]+):([0-9]+):([0-9]+) • (.*)$/\2 (\6)/')
            file=$(echo "$line" | sed -E 's/^\s*(error|warning|info) • (.*) • ([^ ]+):([0-9]+):([0-9]+) • (.*)$/\3/')
            ln=$(echo "$line" | sed -E 's/^\s*(error|warning|info) • (.*) • ([^ ]+):([0-9]+):([0-9]+) • (.*)$/\4/')
            col=$(echo "$line" | sed -E 's/^\s*(error|warning|info) • (.*) • ([^ ]+):([0-9]+):([0-9]+) • (.*)$/\5/')
            [ "$level" = "info" ] && level=notice
            echo "::${level} file=${file},line=${ln},col=${col}::${msg}"
          done

      - name: Test
        id: test
        continue-on-error: true
        run: |
          set +e
          flutter test > test.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          tail -n 80 test.txt

      - name: Post results as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Flutter CI for ${GITHUB_SHA::7}"
            echo "analyze exit=${{ steps.analyze.outputs.status }} · test exit=${{ steps.test.outputs.status }}"
            echo
            echo '<details><summary>flutter analyze</summary>'
            echo
            echo '```'
            grep -E '•|issues found|No issues' analyze.txt | head -n 150
            echo '```'
            echo '</details>'
            echo
            echo '<details><summary>flutter test</summary>'
            echo
            echo '```'
            grep -vE '^\s*$' test.txt | tail -n 60
            echo '```'
            echo '</details>'
          } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md >/dev/null \
            || echo "could not post commit comment"

      - name: Fail if analyze/test failed
        run: |
          [ "${{ steps.analyze.outputs.status }}" = "0" ] && [ "${{ steps.test.outputs.status }}" = "0" ]

  build-apk:
    needs: analyze-test
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build release APK
        run: flutter build apk --release
      - name: Rename APK
        id: apk
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          NAME="billing_app-v${VERSION%%+*}-build${GITHUB_RUN_NUMBER}"
          cp build/app/outputs/flutter-apk/app-release.apk "${NAME}.apk"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          ls -lh "${NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ steps.apk.outputs.name }}.apk
          retention-days: 30

      # A downloadable release so the APK can be installed straight from a
      # phone browser (artifacts require a GitHub login and expire).
      - name: Publish the APK as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.apk.outputs.name }}"
          gh release create "$TAG" "${TAG}.apk" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Release APK built from \`${GITHUB_REF_NAME}\` (commit ${GITHUB_SHA::7}). Offline POS v3.0: new design system, dashboard, global search, held invoices." \
          || gh release upload "$TAG" "${TAG}.apk" --clobber
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
